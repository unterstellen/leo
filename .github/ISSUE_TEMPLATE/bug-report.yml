name: Bug report
description: Something in LEO doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If LEO broke your network: stop the service (`Stop-Service LEO`) and Windows networking is back at once.
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps to reproduce, as exact as you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → About → Copy diagnostics, then paste here. Network names and addresses are left out unless you ticked the box.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LEO version
      placeholder: "0.1.0"
